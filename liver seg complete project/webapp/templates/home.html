<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <title>Segmentation Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- ✅ Correct static link -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-pattern">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-glass fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-activity me-2"></i>MedSeg
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars" aria-controls="navbars" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbars">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('segment', method='yolo') }}">YOLO</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('segment', method='unet') }}">UNet</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero container text-center">
    <div class="hero-badge">Medical AI</div>
    <h1 class="display-5 fw-bold lh-sm">Medical Segmentation Dashboard</h1>
    <p class="lead text-body-secondary mb-0">Choose a model to segment your image — instance or semantic.</p>
  </header>

  <!-- Cards -->
  <main class="container pb-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-5">
        <a class="card card-link h-100" href="{{ url_for('segment', method='yolo') }}">
          <div class="card-body p-4">
            <div class="d-flex align-items-center mb-3">
              <div class="icon-circle me-3"><i class="bi bi-bounding-box-circles"></i></div>
              <h3 class="h5 mb-0">YOLOv8 Segmentation</h3>
            </div>
            <p class="mb-0 text-body-secondary">Instance segmentation using Ultralytics weights.</p>
          </div>
        </a>
      </div>
      <div class="col-md-5">
        <a class="card card-link h-100" href="{{ url_for('segment', method='unet') }}">
          <div class="card-body p-4">
            <div class="d-flex align-items-center mb-3">
              <div class="icon-circle me-3"><i class="bi bi-grid-1x2"></i></div>
              <h3 class="h5 mb-0">UNet Segmentation</h3>
            </div>
            <p class="mb-0 text-body-secondary">Semantic segmentation using your custom UNet.</p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-body-secondary small">
    
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
